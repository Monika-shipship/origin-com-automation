[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "origin-com-automation"
version = "0.1.0"
description = "Safe serialized Origin COM automation for Codex"
requires-python = ">=3.11"
dependencies = [
  "mcp==1.28.1",
  "numpy>=2.2,<3.0",
  "openpyxl>=3.1,<4.0",
  "pandas>=2.2,<3.0",
  "pydantic>=2.6,<3.0",
  "psutil>=7.0,<8.0",
  "pywin32==312; platform_system == 'Windows'",
  "scipy>=1.15,<2.0",
  "xlrd>=2.0,<3.0",
  "typing-extensions>=4.9,<5.0",
]

[project.optional-dependencies]
test = [
  "Pillow>=11.0,<13.0",
  "PyYAML>=6.0,<7.0",
  "pytest>=8.0,<9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires a separately owned Origin COM instance",
  "smoke: live Origin smoke test",
]
